<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projekte</title>

   <style>
        body {
            background-color: black;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }

        .homeButton {
            display: inline-block;
            padding: 8px 20px;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .homeButton:hover {
            border: 2px solid white;
        }

        .überUnsButton {
            display: inline-block;
            padding: 8px 20px;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .überUnsButton:hover {
            border: 2px solid white;
        }

        .projekteButton {
            display: inline-block;
            padding: 8px 20px;
            color: darkgray;
            text-decoration: none;
            border-radius: 5px;
        }

        .projekteButton:hover {
            border: 2px solid white;
        }

        .mythoraHostButton {
            display: inline-block;
            padding: 8px 20px;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .mythoraHostButton:hover {
            border: 2px solid white;
        }

    .button-container {
            margin-top: 20px;
            box-shadow: 0 0 10px #c625db;
            text-shadow: 0 0 10px #c625db;
        }   
    
    .überschrift {
            color: #c625db;
            
        }
    
    .content1 {
            margin-top: 30px;
            color: white;
            border: 2px solid #333;
            border-radius: 5px;
        }

    .TimmefyAIProjekteBild {
            margin-top: 20px;
            width: 50%;
            height: auto;
            cursor: pointer;
        }

    .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            padding-top: 50px;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
        }

    .modal-content {
            margin: auto;
            display: block;
            max-width: 90%;
            max-height: 80vh;
            object-fit: contain;
        }

    .close {
            position: absolute;
            top: 15px;
            right: 35px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }
    </style> 

</head>

<body>
   <div class="button-container">
    <h1 class="überschrift">Mythora Projekte</h1>
       <a href="index.html" class="homeButton">Home</a>
       <a href="überUns.html" class="überUnsButton">Über uns</a>
       <a href="projekte.html" class="projekteButton">Projekte</a>
       <a href="mythoraHost.html" class="mythoraHostButton">Mythora Host</a>
   </div>

   <div class="content1">
    <h2>Unsere Projekte</h2>
    <p>Hier finden Sie eine Übersicht unserer aktuellen und abgeschlossenen Projekte.</p>
    <h3>Aktuelle Projekte:</h3>
    <p>1. Cube Run</p>
    <p>2. Crystal Client</p>
    <p>3. Timmefy AI</p>
    <img src="TimmefyAIProjekte.png" alt="Timmefy AI Bild" class ="TimmefyAIProjekteBild">
    <h3>Abgeschlossene Projekte:</h3>
    <p>Alle Projekte sind in Arbeit.</p>
    </div>

    <div id="myModal" class="modal">
         <span class="close">&times;</span>
        <img class="modal-content" id="img01">
    </div>


    <script>
       const modal = document.getElementById("myModal");
       const img = document.getElementsByClassName("TimmefyAIProjekteBild")[0];
       const modalImg = document.getElementById("img01");
       const closeBtn = document.getElementsByClassName("close")[0];

       img.onclick = function() {
            modal.style.display = "block";
            modalImg.src = this.src;
        }

        closeBtn.onclick = function() {
            modal.style.display = "none";
        }

        modal.onclick = function(event) {
            if (event.target === modal) {
                modal.style.display = "none";
            }
        }
     </script>
</body>

</html>
